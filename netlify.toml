[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", ".prisma"]
  included_files = ["node_modules/.prisma/client/**", "node_modules/@prisma/client/**"]

# The Mini App lives at /app/. The root sends people there.
[[redirects]]
  from = "/"
  to = "/app/"
  status = 302

[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

[[headers]]
  for = "/app/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app/index.html"
  [headers.values]
    Cache-Control = "no-cache"
