<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Trashfree · Call</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f2f4f3; color: #14201a;
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) { body { background: #101412; color: #ecf1ee; } }
  main { width: 100%; max-width: 420px; padding: 24px 16px; text-align: center; }
  a.call { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 72px; border-radius: 20px;
    background: #15803d; color: #fff; text-decoration: none; font-weight: 700; font-size: 20px; }
  a.call small { font-weight: 500; font-size: 15px; opacity: .9; }
  p { opacity: .75; font-size: 15px; }
</style>
</head>
<body>
<main>
  <a class="call" id="call" href="#">📞 Qo'ng'iroq · Позвонить · Call<small id="num"></small></a>
  <p>Telegram'ga qaytish uchun orqaga bosing · Нажмите «назад», чтобы вернуться · Press back to return</p>
</main>
<script>
  // The number comes in the #hash, which is never sent to any server. Only digits and "+" are allowed.
  var n = decodeURIComponent(location.hash.slice(1)).replace(/[^\d+]/g, "");
  var ok = /^\+?\d{7,15}$/.test(n);
  var a = document.getElementById("call");
  if (ok) {
    a.href = "tel:" + n;
    document.getElementById("num").textContent = n;
    location.replace("tel:" + n); // opens the Phone app right away where the browser allows it
  } else {
    a.style.display = "none";
  }
</script>
</body>
</html>
